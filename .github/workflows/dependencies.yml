name: Dependency versions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm run check:dependencies
      - run: npm ci
