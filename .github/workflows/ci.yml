name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    name: 2. Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck

  tests:
    name: 3. Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Run unit and integration tests
        id: coverage
        shell: bash
        run: npm run test:coverage | tee test-results.txt
      - name: Publish test and coverage results
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        run: |
          {
            echo '### Unit and integration tests'
            echo '~~~text'
            cat test-results.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 01. Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Audit locked npm dependencies
        shell: bash
        run: npm audit --package-lock-only --include=dev --audit-level=high | tee "$RUNNER_TEMP/npm-audit.txt"
      - name: Retain dependency scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-scan
          path: ${{ runner.temp }}/npm-audit.txt
          if-no-files-found: ignore

  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t task-api:ci .
      - name: Scan runtime image
        shell: bash
        run: |
          docker save task-api:ci -o "$RUNNER_TEMP/task-api.tar"
          docker run --rm --mount "type=bind,source=$RUNNER_TEMP/task-api.tar,target=/image.tar,readonly" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress |
            tee "$RUNNER_TEMP/trivy-image.txt"
      - name: Retain image scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-scan
          path: ${{ runner.temp }}/trivy-image.txt
          if-no-files-found: ignore
      - name: Smoke-test scanned image
        shell: bash
        run: |
          container=$(docker run --rm -d -p 127.0.0.1::3000 task-api:ci)
          trap 'docker stop "$container" >/dev/null' EXIT
          address=$(docker port "$container" 3000/tcp)
          test "$(docker exec "$container" id -u)" = 1000
          curl -fsS --retry 5 --retry-all-errors --retry-delay 1 --max-time 5 \
            -o "$RUNNER_TEMP/health.json" "http://$address/health"
          jq -e '.status == "ok"' "$RUNNER_TEMP/health.json"
          curl -fsS "http://$address/ready" | jq -e '.status == "ready"'
          status=$(curl -fsS -o "$RUNNER_TEMP/task.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"title":"CI smoke test"}' "http://$address/api/tasks")
          test "$status" = 201
          jq -e '.title == "CI smoke test" and .status == "todo"' "$RUNNER_TEMP/task.json"
      - name: Pass scanned image to publisher
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: scanned-image
          path: ${{ runner.temp }}/task-api.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish-image:
    name: Publish Scanned Image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [code-quality, tests, build, dependency-scan, image-scan]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@v8
        with:
          name: scanned-image
          path: ${{ runner.temp }}
      - name: Publish image to GHCR
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$image:$GITHUB_SHA"
          docker load -i "$RUNNER_TEMP/task-api.tar"
          docker tag task-api:ci "$tag"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push --platform linux/amd64 "$tag" 2>&1 | tee "$RUNNER_TEMP/docker-push.txt"
          digest=$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$RUNNER_TEMP/docker-push.txt")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="$image@$digest"
          docker buildx imagetools inspect "$reference" > /dev/null
          printf 'image=%s\n' "$reference" >> "$GITHUB_OUTPUT"
          printf 'Published image: `%s`\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
